[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeval"
version = "0.1.1"
description = "GPU-accelerated edge detection evaluation (ODS/OIS/AP/R50)"
readme = "README.md"
authors = [
    { name = "0xrjman & Contributors" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["edge-detection", "evaluation", "cuda", "gpu", "ods", "ois", "bsds500"]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy>=1.6.0",
    "opencv-python",
    "tqdm",
    "click",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/0xrjman/edgeval.cu"
Repository = "https://github.com/0xrjman/edgeval.cu"

[project.scripts]
edgeval = "edgeval_cu.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgeval_cu", "edgeval_cu.*", "cxx", "cxx.*"]

[tool.setuptools.package-data]
edgeval_cu = [
    "cuda/*.cu",
    "cuda/*.so",
]
cxx = [
    "lib/*.so",
]

[tool.setuptools]
zip-safe = false
